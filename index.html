<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URBANA777 | Em Breve</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            color: #ffffff;
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { 
            font-size: 4em; 
            letter-spacing: 4px; 
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .destaque {
            color: #ff4500; /* Cor laranja vibrante para dar contraste */
        }
        p {
            font-size: 1.2em;
            color: #aaaaaa;
            max-width: 600px;
            margin-bottom: 30px;
        }
        .btn { 
            background-color: #ffffff; 
            color: #121212; 
            padding: 15px 30px; 
            text-decoration: none; 
            font-weight: bold;
            border-radius: 5px; 
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #ff4500;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>URBANA<span class="destaque">777</span></h1>
    <p>O nosso site está sendo construído. Em breve, uma nova experiência de compras para você.</p>
    
    <!-- Se você tiver um Instagram ou WhatsApp da loja, coloque o link no lugar do # abaixo -->
    <a href="#" class="btn">Acompanhe as novidades</a>

</body>
</html>
